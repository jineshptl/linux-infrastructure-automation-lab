---
- name: Install Docker on app servers
  hosts: app
  become: true

  tasks:
    - name: Install Docker and Docker Compose
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose-v2
        state: present
        update_cache: true

    - name: Start Docker and enable on boot
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    - name: Let the login user run Docker without sudo
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: docker
        append: true
